name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: macos, os: macos-latest }     # arm64
          - { platform: linux, os: ubuntu-latest }    # x86_64
          - { platform: windows, os: windows-latest } # x86_64
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: { python-version: '3.14' }
      - run: python scripts/ci.py guard
      # Linux builds inside docker image rust:1.100.0-bookworm (driven by ci.py).
      # rustup >= 1.28 does not auto-install from rust-toolchain.toml, so install it explicitly.
      - if: matrix.platform != 'linux'
        run: rustup toolchain install --profile minimal
      - run: python scripts/ci.py build --platform ${{ matrix.platform }} --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/${{ matrix.platform }}/plainpaste-*
          archive: false
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v8.0.2
        with: { path: dist, skip-decompress: true } # macOS asset is itself a zip
      - run: python scripts/ci.py publish --tag "$GITHUB_REF_NAME" --from dist
        env: { GH_TOKEN: '${{ github.token }}' }
