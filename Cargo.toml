[package]
name = "plainpaste"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"

[dependencies]
enigo = "0.6.1"
global-hotkey = "0.10.0"
log = "0.4.35"
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-18", "unstable-winit-030", "renderer-femtovg", "renderer-software"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[build-dependencies]
slint-build = { version = "1.18.1", default-features = false, features = ["compat-1-18"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSObject"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[profile.dev]
debug = "line-tables-only"
incremental = false
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
